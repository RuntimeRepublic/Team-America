name: Onboard open

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency: onboard-${{ github.event.issue.number }}

jobs:
  open:
    name: Create member file
    if: contains(github.event.issue.labels.*.name, 'onboarding')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open onboarding
        uses: actions/github-script@v7
        with:
          script: |
            const logic = require(`${process.env.GITHUB_WORKSPACE}/.github/onboarding/logic.js`);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const issueNumber = issue.number;

            async function ensureLabel(name, color) {
              try {
                await github.rest.issues.createLabel({ owner, repo, name, color });
              } catch (error) {
                if (logic.httpStatus(error) !== 422) throw error;
              }
            }

            await ensureLabel('onboarding', '1d76db');
            await ensureLabel('onboarded', '0e8a16');
            await ensureLabel('needs-admin', 'b60205');

            if (logic.isBot(issue.user)) return;

            const login = issue.user.login;
            if (!logic.validLogin(login)) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: logic.INVALID_LOGIN_COMMENT
              });
              return;
            }

            const memberPath = `members/${login}.md`;

            async function readMemberFile() {
              try {
                const response = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: memberPath,
                  ref: 'main'
                });
                return logic.decodeGithubContent(response.data);
              } catch (error) {
                if (logic.httpStatus(error) === 404) return null;
                throw error;
              }
            }

            async function closeAlreadyMember() {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: logic.ALREADY_MEMBER
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issueNumber,
                state: 'closed',
                state_reason: 'not_planned'
              });
            }

            const existing = await readMemberFile();
            if (existing && !logic.sameIssueMember(existing, issueNumber)) {
              await closeAlreadyMember();
              return;
            }

            if (!existing) {
              const content = logic.memberFile({
                login,
                joined: logic.chicagoDate(),
                ai: logic.parseAi(issue.body || ''),
                issueNumber
              });
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner,
                  repo,
                  path: memberPath,
                  message: `Add members/${login}.md\n\nOnboarding issue #${issueNumber}`,
                  content: Buffer.from(content, 'utf8').toString('base64'),
                  branch: 'main'
                });
              } catch (error) {
                if (logic.httpStatus(error) !== 422) throw error;
                const raced = await readMemberFile();
                if (!raced || !logic.sameIssueMember(raced, issueNumber)) {
                  await closeAlreadyMember();
                  return;
                }
              }
            }

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issueNumber,
              title: `ONBOARD: ${login}`
            });

            let welcome = logic.FALLBACK_WELCOME;
            try {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path: 'ONBOARDING.md',
                ref: 'main'
              });
              welcome = logic.welcomeFromOnboarding(logic.decodeGithubContent(response.data));
            } catch (error) {
              if (logic.httpStatus(error) !== 404) throw error;
            }

            if (/^Smoke test check word:/m.test(welcome)) {
              core.setFailed('Welcome comment still contains the smoke test line');
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: welcome
            });
